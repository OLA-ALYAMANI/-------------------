<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام البحث عن الموظفين - ملفات متعددة</title>
  
  <!-- استدعاء ملف التنسيق -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- استدعاء مكتبة SheetJS لقراءة ملفات Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- ------------ SATART HEADER AREA ------------ -->

  <header class="header-area">
    <div class="header-nav">
      <nav class="navbar">
          <a  class="navbar-link" href="./index.html">
            <img class="logo" src="./img/rb-logo-ar-arabiccoupon-rb-coupons-and-promo-codes-400x400-removebg-preview.png" alt="R&B">
          </a>
        </nav>
    </div>
  </header>

  <!-- ------------ END SEARCH AREA ------------ -->

  <!-- ------------ START SEARCH AREA ------------ -->

  <section class="search-area">
    <div class="card">
      <h3 class="search-title">البحث عن بيانات موظف</h3>
      
      <!-- قسم رفع ملفات Excel (يدعم ملفات متعددة) -->
      <div class="input-group">
        <label for="excelFiles">اختر ملفات Excel (يمكن تحديد أكثر من ملف):</label>
        <input type="file" id="excelFiles" accept=".xlsx, .xls" multiple>
        <small id="fileStatus"></small>
      </div>
      
      <!-- قسم إدخال الرقم الوظيفي -->
      <div class="input-group">
        <label for="empIdInput">الرقم الوظيفي (Employee ID):</label>
        <input type="text" id="empIdInput" placeholder="أدخل الرقم الوظيفي...">
      </div>
      
      <!-- زر البحث -->
      <button onclick="searchEmployee()">بحث</button>
      <!-- <div id="gridContainer" style="display: grid; gap: 10px; margin-top: 20px;"></div> -->

      
    </div>
  </section>

  <!-- حاوية عرض النتائج -->
  <section class="result">
      <div id="resultArea"></div>
  </section>

  <!-- ------------ END SEARCH AREA ------------ -->

  <!-- استدعاء ملف البرمجة والمنطق -->
  <!-- <script src="./js/main.js"></script> -->
   <script src="./js/single-file.js"></script>
</body>
</html>
