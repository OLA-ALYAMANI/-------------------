<!DOCTYPE html>
<html lang="ar-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="./css/search-style.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- ----- START HEADR AREA ----- -->
    <header class="header-area">
        <div class="header-list">
            <nav class="navbar">
                <a class="navbar-link" href="./Home.html">
                    <img class="logo" src="./img/rb-logo-ar-arabiccoupon-rb-coupons-and-promo-codes-400x400-removebg-preview.png" alt="R&B Logo" >
                </a>
            
                <div class="user-box">
                    <button class="logout-btn"><Label></Label>Log Out</button>
                    <span class="welcome">Welcom Rbab</span>
                </div>
            </nav>
        </div>
    </header>
    <!-- ----- END HEADR AREA ----- -->

    <!-- ----- START MAIN AREA ----- -->
<div class="container">

    <!-- ULOAD FILE -->
    <div class="upload-file">
        <label class="upload-btn">
        <input type="file" id="excelFiles" multiple hidden>
        <span class="icon"><img src="./img/file.png" alt="upload-files"></span>
        Upload a new Excel file
        </label>
    </div>

    <!-- SEARCH -->
    <div class="search-area">
        <div class="search-box">
            <img  class="icon-img" src="./img/loupe.png" alt="search-icon">
            <input type="text" placeholder="Employee ID ...">
        </div>
        <button class="search-btn" onclick="searchEmployee()">
            <img src="./img/search.png" alt="seach">
            <p>Search</p>
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th id="Emp-name">Name</th>
                    <th id="Emp-ID">ID</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>123456</td>
                    <td>محمد</td>
                    <td>
                        <button class="display-btn">Show</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
 <div class="shapes">
    <span class="shape shape-1"></span>
    <span class="shape shape-2"></span>
    <span class="shape shape-3"></span>
</div>
</body>
</html>
