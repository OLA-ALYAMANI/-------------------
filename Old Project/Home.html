<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <img src="./img/rb-logo-ar-arabiccoupon-rb-coupons-and-promo-codes-400x400-removebg-preview.png" alt="R&B Logo">
        </div>
        <div class="login-box">
            <h3>تسجيل الدخول</h3>

            <label>الرقم الوظيفي</label>
            <input type="text" placeholder="أدخل الرقم الوظيفي">

            <label>كلمة المرور</label>
            <input type="password" placeholder="أدخل كلمة المرور">

            <button class="login-btn">تسجيل الدخول</button>
        </div>

        <div class="shapes">
            <span class="shape shape-1"></span>
            <span class="shape shape-2"></span>
            <span class="shape shape-3"></span>
        </div>

    </div>
</body>
<script src="./js/main.js"></script>
</html>
